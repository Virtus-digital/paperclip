# Virtus fork'unun imaj derlemesi: ghcr.io/virtus-digital/paperclip:<surum>
#
# NEDEN AYRI BIR WORKFLOW
#   Deploy upstream'in yayinladigi imaji (ghcr.io/paperclipai/paperclip)
#   KULLANMIYOR; guncellemeler kontrollu olsun diye imaj bu fork'tan derleniyor.
#   Upstream'in kendi workflow'lari bu fork'ta KOSMUYOR:
#     - varsayilan dal `virtus`, upstream dosyalarini tasimiyor (yalniz bu
#       workflow + README.md) => zamanlanmis isler ve dispatch'ler yok
#     - upstream etiketleri `upstream/` onekiyle aynalaniyor; upstream'in
#       docker.yml'i `v*`, `nightly/v*`, `beta/v*` etiketlerinde tetikleniyor,
#       `upstream/v*` bunlarin hicbirine uymuyor
#     - fork'ta `master` dali YOK => upstream'in `push: branches: master`
#       tetikleyicileri tetiklenecek bir dal bulamiyor
#   Yordam: README.md.
#
# KAYNAK KAPISI
#   Derlenen agac, upstream'in AYNI adli etiketinin commit'i olmak ZORUNDA.
#   Aynalanan etiket ayrisirsa (fork'a yama girdiyse, yanlis sha aynalandiysa)
#   derleme durur. Yamali bir surum gerekirse bu kapi bilerek degistirilir,
#   sessizce atlanmaz.
#
# DEGISMEZLIK
#   Ayni etiket ikinci kez derlenmez: imaj etiketi varsa is kirmizi yanar.
#   Deploy etiket + digest ile sabitledigi icin bir etiketin icerigi yerinde
#   degismemeli.
#
# RUNNER: Virtus ARC, GitHub'in kendi runner'lari DEGIL (kullanici karari,
#   2026-10-01). Bu repo public oldugu icin org'un ana ARC grubu ("Default")
#   onu calistirmiyor; derleme kendi grubunda (`paperclip-imaj`) kendi scale
#   set'inde kosuyor: deploy -> platform-fra/arc-runners-paperclip. Grup
#   YALNIZ bu dosyaya, YALNIZ `refs/heads/virtus` uzerinden aciliyor
#   (`restricted_to_workflows`); bu dosyanin adi ya da dali degisirse grubun
#   `selected_workflows` listesi de degismeli, yoksa is runner bulamaz.
#
# Derleme adimlari upstream'in docker.yml'inden (v2026.916.1) alindi: kilit
# dosyasi tazeleme, `--target production`, uc build-arg ve sema etiketleri.
# Farklar: yalniz linux/amd64 (fra node'lari amd64), tek is (manifest
# birlestirme yok), surum etiketten verilir (git describe `upstream/` onekli
# etiketi `v*` desenine uydurmadigi icin bos donerdi), upstream'in "Free
# runner disk" adimi YOK (GitHub runner'inin on kurulu araclarini siliyor;
# ARC pod'u bos basliyor, disk siniri dind'in ephemeral-storage limiti).
name: imaj

on:
  workflow_dispatch:
    inputs:
      surum:
        description: "Upstream surum etiketi (or. v2026.916.1). Bu fork'ta upstream/<surum> olarak aynalanmis olmali."
        required: true
        type: string

permissions: {}

concurrency:
  group: imaj-${{ inputs.surum }}
  cancel-in-progress: false

jobs:
  derle:
    # TETIKLEYEN KAPISI: yalniz bu listedeki kullanicilar derleme baslatabilir.
    #   Org'un butun repolarina erisen ve `actions: write` tasiyan bir App
    #   (olculdu 2026-10-01: `slack`) bu workflow'u dispatch edebiliyordu.
    #   Kosul is duzeyinde: yetkisiz tetiklemede is `skipped` olur ve ARC'den
    #   runner HIC istenmez (pod acilmaz). `actor` ve `triggering_actor`
    #   ikisi de bakiliyor: yeniden kosturmada (re-run) tetikleyen degisebilir.
    #   Listeyi degistirmek bu dosyayi degistirmek demek: `virtus` dalina
    #   push yalniz repo admin'ine acik (ruleset `dallar-yalniz-admin`) ve
    #   workflow dosyasi `workflows` izni istiyor.
    if: >-
      contains(fromJSON('["Melihunlu"]'), github.actor) &&
      contains(fromJSON('["Melihunlu"]'), github.triggering_actor)
    runs-on: virtusdigital-arc-paperclip
    # dind 3 CPU ile sinirli (upstream'in runner'i 4 vCPU); sure OLCULMEDI.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      SURUM: ${{ inputs.surum }}
      IMAJ: ghcr.io/virtus-digital/paperclip
      UPSTREAM: https://github.com/paperclipai/paperclip
    steps:
      # ARC'de docker dind sidecar'indan geliyor; yoksa sebebi sidecar'in
      # kendisi (privileged pod reddi, scale set sorunu). virtus-code-preview
      # ci.yml'in `imaj` isindeki ayni yoklama.
      - name: Docker var mi (yoklama)
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::Bu runner'da docker YOK (dind sidecar'i ayakta degil)."
            exit 1
          fi
          docker version --format '{{.Server.Version}}' || {
            echo "::error::docker istemcisi var ama sunucuya baglanamiyor."
            exit 1; }

      - name: Girdiyi dogrula ve kaynagi coz
        id: kaynak
        run: |
          set -euo pipefail
          if ! printf '%s' "$SURUM" | grep -Eq '^v[0-9]{4}\.[0-9]+\.[0-9]+$'; then
            echo "gecersiz surum: '$SURUM' (beklenen bicim: v2026.916.1)" >&2
            exit 1
          fi
          # Etiket hafif ya da aciklamali olabilir: ^{} varsa commit odur.
          coz() {
            local satirlar
            satirlar="$(git ls-remote "$1" "refs/tags/$2" "refs/tags/$2^{}")"
            printf '%s\n' "$satirlar" | awk -v r="refs/tags/$2^{}" '$2 == r { print $1; f = 1 } END { if (!f) exit 1 }' \
              || printf '%s\n' "$satirlar" | awk '{ print $1; exit }'
          }
          fork="$(coz "https://github.com/${GITHUB_REPOSITORY}" "upstream/${SURUM}")"
          ust="$(coz "$UPSTREAM" "$SURUM")"
          echo "fork   upstream/${SURUM} -> ${fork:-<yok>}"
          echo "upstream ${SURUM}        -> ${ust:-<yok>}"
          if [ -z "$fork" ] || [ -z "$ust" ]; then
            echo "etiket bulunamadi (fork ya da upstream)" >&2
            exit 1
          fi
          if [ "$fork" != "$ust" ]; then
            echo "KAYNAK AYRISTI: fork etiketi upstream etiketiyle ayni commit degil" >&2
            exit 1
          fi
          echo "commit=$fork" >> "$GITHUB_OUTPUT"
          echo "version=${SURUM#v}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiket daha once yayinlanmis mi
        env:
          VERSION: ${{ steps.kaynak.outputs.version }}
        run: |
          set -euo pipefail
          if docker manifest inspect "${IMAJ}:${VERSION}" > /dev/null 2>&1; then
            echo "${IMAJ}:${VERSION} zaten var; ayni etiket yeniden derlenmez" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.kaynak.outputs.commit }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # pnpm/action-setup KULLANILMIYOR: v6 `@pnpm/exe`'nin tek dosyalik
      # ikilisini kuruyor ve o ikili `libatomic.so.1` istiyor. ARC'nin
      # actions-runner:2.337.0 imajinda bu kutuphane yok; ilk ARC kosusu
      # (36881514548) "error while loading shared libraries: libatomic.so.1"
      # ile dustu. npm paketi saf JS, ek kutuphane istemiyor. Surum
      # upstream'in docker.yml'indekiyle ayni.
      - name: Setup pnpm
        run: |
          set -euo pipefail
          npm install --global pnpm@9.15.4
          pnpm --version

      # Upstream'in docker.yml'i ile ayni adim: Dockerfile `--frozen-lockfile`
      # ile kuruyor, kilit dosyasi paket meta verisinin gerisindeyse derleme
      # duser. Yalniz pnpm-lock.yaml degisebilir, baska dosya degisirse durur.
      - name: Refresh lockfile for Docker build context
        run: |
          set -euo pipefail
          pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile already matches package metadata."
            echo "- kilit dosyasi: degismedi" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi
          echo "- kilit dosyasi: derleme baglaminda TAZELENDI (upstream deseni)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Compute schema migration labels
        id: schema
        run: |
          set -euo pipefail
          last=$(ls packages/db/src/migrations/*.sql | sed 's|.*/||' | LC_ALL=C sort | tail -1)
          count=$(ls packages/db/src/migrations/*.sql | wc -l | tr -d ' ')
          echo "last=${last}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          build-args: |
            PAPERCLIP_BUILD_VERSION=${{ steps.kaynak.outputs.version }}
            PAPERCLIP_BUILD_COMMIT=${{ steps.kaynak.outputs.commit }}
            CLI_TOOLS_CACHE_EPOCH=${{ steps.kaynak.outputs.epoch }}
          tags: ${{ env.IMAJ }}:${{ steps.kaynak.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.kaynak.outputs.commit }}
            org.opencontainers.image.version=${{ steps.kaynak.outputs.version }}
            io.github.paperclipai.schema.last-migration=${{ steps.schema.outputs.last }}
            io.github.paperclipai.schema.migration-count=${{ steps.schema.outputs.count }}
          push: true
          cache-from: type=registry,ref=${{ env.IMAJ }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAJ }}:buildcache,mode=max

      # Havuzun dind limitleri (8Gi bellek, 30Gi ephemeral) OLCULMEDEN kondu
      # (deploy -> platform-fra/arc-runners-paperclip/values.yaml). Bu adim
      # her kosuda tepe noktaya yakin degerleri basiyor; is dusse de kosar.
      - name: Disk olcumu
        if: always()
        run: |
          set +e
          docker system df
          docker buildx du 2>/dev/null | tail -3
          df -h / /home/runner/_work 2>/dev/null

      - name: Ozet
        env:
          VERSION: ${{ steps.kaynak.outputs.version }}
          COMMIT: ${{ steps.kaynak.outputs.commit }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          {
            echo "## ${IMAJ}:${VERSION}"
            echo
            echo "- kaynak: upstream/${SURUM} = \`${COMMIT}\` (upstream ${SURUM} ile ayni commit)"
            echo "- digest: \`${DIGEST}\`"
            echo "- deploy referansi: \`${IMAJ}:${VERSION}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
